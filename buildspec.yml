version: 0.2

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region ca-central-1 | docker login --username AWS --password-stdin 650251685614.dkr.ecr.ca-central-1.amazonaws.com

  build:
    commands:
      - echo "Building Docker image..."
      - docker build -t test .
      - docker tag test:latest 650251685614.dkr.ecr.ca-central-1.amazonaws.com/wild-rydes-app:latest
      - echo "Pushing Docker image to ECR..."
      - docker push 650251685614.dkr.ecr.ca-central-1.amazonaws.com/wild-rydes-app:latest

  post_build:
    commands:
      - echo "Generating imagedefinitions.json..."
      - echo '[{"name":"test","imageUri":"650251685614.dkr.ecr.ca-central-1.amazonaws.com/wild-rydes-app:latest"}]' > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
